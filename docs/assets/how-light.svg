<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="How ravnori works"><defs><marker id="ah-134765685253504" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E736F"/></marker></defs><rect width="1280" height="540" rx="20" fill="#ffffff"/><rect x="0.5" y="0.5" width="1279" height="539" rx="20" fill="none" stroke="#D6E2D6"/><rect x="40" y="70" width="250" height="96" rx="14" fill="#F4F8F3" stroke="#D6E2D6"/><text x="58" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#102825">Claude Code</text><text x="58" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">writes ~/.claude/projects</text><rect x="40" y="190" width="250" height="96" rx="14" fill="#F4F8F3" stroke="#D6E2D6"/><text x="58" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#102825">Codex</text><text x="58" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">writes ~/.codex/sessions</text><rect x="40" y="310" width="250" height="96" rx="14" fill="#F4F8F3" stroke="#D6E2D6"/><text x="58" y="342" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#102825">pi</text><text x="58" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">writes ~/.pi/agent/sessions</text><rect x="380" y="70" width="470" height="336" rx="16" fill="#E9F2E7" stroke="#137A64" stroke-width="2"/><g transform="translate(398,86) scale(0.24242424242424243)"><g transform="translate(1 1)">
  <path d="M19 44L65 20L111 44L65 68Z" fill="#102825"/>
  <path d="M19 66L65 90L111 66" fill="none" stroke="#102825" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 88L65 112L111 88" fill="none" stroke="#102825" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="65" cy="44" r="9" fill="#168F76"/>
</g></g><text x="438" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#102825">ravnori</text><text x="402" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#137A64">Capture</text><text x="476" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">reads transcripts as they grow; a crash or</text><text x="476" y="179" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">a missed hook delays it, never loses it</text><text x="402" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#137A64">Record</text><text x="476" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">one local SQLite: prompts, edits, commands;</text><text x="476" y="243" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">deduplicated, secrets redacted, deletable</text><text x="402" y="286" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#137A64">Distil</text><text x="476" y="286" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">memories that cite the events they came from,</text><text x="476" y="307" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">with your own Claude Code, Codex or endpoint</text><text x="402" y="350" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#137A64">Check</text><text x="476" y="350" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">whether a memory's own code is still there</text><rect x="940" y="70" width="300" height="96" rx="14" fill="#F4F8F3" stroke="#137A64"/><text x="958" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#102825">Back to your agents</text><text x="958" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">session start, each prompt, opening a file</text><text x="958" y="153" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">MCP tools: search, get_observations, …</text><rect x="940" y="190" width="300" height="96" rx="14" fill="#F4F8F3" stroke="#D6E2D6"/><text x="958" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#102825">To you</text><text x="958" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">the viewer at 127.0.0.1:37777</text><text x="958" y="273" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">rvn ask “why did we …”, with sources</text><rect x="940" y="310" width="300" height="96" rx="14" fill="#F4F8F3" stroke="#D6E2D6"/><text x="958" y="342" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#102825">To your tools</text><text x="958" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">record API: read-only, local, token</text><text x="958" y="393" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3A504C">rvn trace: Agent Trace for commits</text><line x1="296" y1="118" x2="372" y2="118" stroke="#5E736F" stroke-width="2" marker-end="url(#ah-134765685253504)"/><line x1="856" y1="118" x2="932" y2="118" stroke="#5E736F" stroke-width="2" marker-end="url(#ah-134765685253504)"/><line x1="296" y1="238" x2="372" y2="238" stroke="#5E736F" stroke-width="2" marker-end="url(#ah-134765685253504)"/><line x1="856" y1="238" x2="932" y2="238" stroke="#5E736F" stroke-width="2" marker-end="url(#ah-134765685253504)"/><line x1="296" y1="358" x2="372" y2="358" stroke="#5E736F" stroke-width="2" marker-end="url(#ah-134765685253504)"/><line x1="856" y1="358" x2="932" y2="358" stroke="#5E736F" stroke-width="2" marker-end="url(#ah-134765685253504)"/><text x="640" y="458" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#3A504C">Everything stays on your machine. The only thing that leaves it: redacted excerpts sent to the model <tspan font-weight="700">you</tspan> choose, to write memories.</text><text x="640" y="488" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#3A504C">One binary · no Node, Python, Docker or vector database · Linux, WSL and macOS</text></svg>
