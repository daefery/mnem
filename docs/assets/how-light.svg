<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-label="How mnem works"><defs><marker id="ah-126123200226496" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/></marker></defs><rect width="1280" height="540" rx="20" fill="#ffffff"/><rect x="0.5" y="0.5" width="1279" height="539" rx="20" fill="none" stroke="#d0d7de"/><rect x="40" y="70" width="250" height="96" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="58" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">Claude Code</text><text x="58" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">writes ~/.claude/projects</text><rect x="40" y="190" width="250" height="96" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="58" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">Codex</text><text x="58" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">writes ~/.codex/sessions</text><rect x="40" y="310" width="250" height="96" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="58" y="342" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">pi</text><text x="58" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">writes ~/.pi/agent/sessions</text><rect x="380" y="70" width="470" height="336" rx="16" fill="#eef2f5" stroke="#0f766e" stroke-width="2"/><g transform="translate(398,86) scale(0.5)">
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#0f766e"/>
  <rect x="14" y="17" width="36" height="7" rx="3.5" fill="#99f6e4"/>
  <rect x="14" y="28.5" width="28" height="7" rx="3.5" fill="#5eead4"/>
  <rect x="14" y="40" width="20" height="7" rx="3.5" fill="#2dd4bf"/>
</g><text x="438" y="114" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#1f2328">mnem</text><text x="402" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Capture</text><text x="476" y="158" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">reads transcripts as they grow; a crash or</text><text x="476" y="179" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">a missed hook delays it, never loses it</text><text x="402" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Record</text><text x="476" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">one local SQLite: prompts, edits, commands;</text><text x="476" y="243" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">deduplicated, secrets redacted, deletable</text><text x="402" y="286" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Distil</text><text x="476" y="286" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">memories that cite the events they came from,</text><text x="476" y="307" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">with your own Claude Code, Codex or endpoint</text><text x="402" y="350" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Check</text><text x="476" y="350" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">whether a memory's own code is still there</text><rect x="940" y="70" width="300" height="96" rx="14" fill="#f6f8fa" stroke="#0f766e"/><text x="958" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">Back to your agents</text><text x="958" y="130" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">session start, each prompt, opening a file</text><text x="958" y="153" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">MCP tools: search, get_observations, …</text><rect x="940" y="190" width="300" height="96" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="958" y="222" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">To you</text><text x="958" y="250" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">the viewer at 127.0.0.1:37777</text><text x="958" y="273" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">mnem ask “why did we …”, with sources</text><rect x="940" y="310" width="300" height="96" rx="14" fill="#f6f8fa" stroke="#d0d7de"/><text x="958" y="342" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1f2328">To your tools</text><text x="958" y="370" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">record API: read-only, local, token</text><text x="958" y="393" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#475260">mnem trace: Agent Trace for commits</text><line x1="296" y1="118" x2="372" y2="118" stroke="#6e7781" stroke-width="2" marker-end="url(#ah-126123200226496)"/><line x1="856" y1="118" x2="932" y2="118" stroke="#6e7781" stroke-width="2" marker-end="url(#ah-126123200226496)"/><line x1="296" y1="238" x2="372" y2="238" stroke="#6e7781" stroke-width="2" marker-end="url(#ah-126123200226496)"/><line x1="856" y1="238" x2="932" y2="238" stroke="#6e7781" stroke-width="2" marker-end="url(#ah-126123200226496)"/><line x1="296" y1="358" x2="372" y2="358" stroke="#6e7781" stroke-width="2" marker-end="url(#ah-126123200226496)"/><line x1="856" y1="358" x2="932" y2="358" stroke="#6e7781" stroke-width="2" marker-end="url(#ah-126123200226496)"/><text x="640" y="458" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#475260">Everything stays on your machine. The only thing that leaves it: redacted excerpts sent to the model <tspan font-weight="700">you</tspan> choose, to write memories.</text><text x="640" y="488" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#475260">One binary · no Node, Python, Docker or vector database · Linux, WSL and macOS</text></svg>
