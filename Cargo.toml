[package]
name = "mnem"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fastembed = { version = "7.1.0", optional = true, default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
model2vec-rs = "0.3.0"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[features]
fastembed = ["dep:fastembed"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
