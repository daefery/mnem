<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mnem</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="header">
    <div class="header-main">
      <h1>
        <img src="/logo.svg" alt="" class="mnem-logomark" id="logomark">
        <span class="logo-text">mnem</span>
      </h1>
    </div>
    <div class="status">
      <input class="mnem-search" id="search" type="search" placeholder="Search memory…" autocomplete="off">
      <span class="mnem-health" id="health" title="Capture health">
        <span class="dot"></span><span class="label" id="health-label">…</span>
      </span>
      <select id="project">
        <option value="">All Projects</option>
      </select>
      <button class="theme-toggle-btn" id="theme" title="Theme"></button>
      <button class="settings-btn" id="context-btn" title="Session-start context preview">
        <svg class="settings-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>

  <div class="feed" id="feed">
    <div class="feed-content" id="feed-content"></div>
  </div>

  <button class="scroll-to-top" id="to-top" title="Scroll to top" style="display:none">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <div class="modal-backdrop" id="context-modal" style="display:none">
    <div class="context-settings-modal">
      <div class="modal-header">
        <h2>Session-start context</h2>
        <div class="header-controls">
          <label class="preview-selector">
            Project
            <select id="context-project"></select>
          </label>
          <button class="modal-close-btn" id="context-close" title="Close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body">
        <div class="preview-column">
          <div class="preview-content"><pre id="context-text">Loading…</pre></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
